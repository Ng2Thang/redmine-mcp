services:
  restore-copy:
    profiles: ["ops"]
    image: postgres:16.8-bookworm@sha256:301bcb60b8a3ee4ab7e147932723e3abd1cef53516ce5210b39fd9fe5e3602ae
    environment:
      PGHOST: postgres
      PGUSER: redmine
      PGDATABASE: redmine
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the isolated env file}
    volumes:
      - ${PREP005_SNAPSHOT_DIR:?Set the isolated snapshot directory}:/snapshot:ro
      - redmine_files:/redmine-files
      - ../tools/upgrade/restore-copy.sh:/usr/local/bin/restore-copy:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/restore-copy"]
    depends_on:
      postgres:
        condition: service_healthy
