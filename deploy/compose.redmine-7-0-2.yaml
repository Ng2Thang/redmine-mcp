name: redmine-mcp-7-0-2
services:
  mcp-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      REDMINE_URL: http://redmine:3000
      REDMINE_WRITE_ENABLED: "false"
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      redmine:
        condition: service_healthy

  postgres:
    image: postgres:16.8-bookworm@sha256:301bcb60b8a3ee4ab7e147932723e3abd1cef53516ce5210b39fd9fe5e3602ae
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the isolated env file}
    volumes:
      - redmine_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine -d redmine"]
      interval: 5s
      timeout: 5s
      retries: 30

  redmine:
    image: redmine:7.0.2-bookworm@sha256:5cb12288dbfb807f136adbee02d60a96acc24edad0404cbfce214a7ced39ff6a
    environment:
      REDMINE_DB_POSTGRES: postgres
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDMINE_SECRET_KEY_BASE: ${REDMINE_SECRET_KEY_BASE:?Set REDMINE_SECRET_KEY_BASE in the isolated env file}
      REDMINE_TEST_MARKER: redmine-mcp-synthetic-v1
      REDMINE_NO_DB_MIGRATE: "1"
      RAILS_ENV: production
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - redmine_files:/usr/src/redmine/files
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/login')).code == '200' ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  redmine_db_data:
    labels:
      redmine-mcp.environment: synthetic-upgrade-7-0-2
  redmine_files:
    labels:
      redmine-mcp.environment: synthetic-upgrade-7-0-2
