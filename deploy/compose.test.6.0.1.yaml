# Redmine 6.0.1: separate project, volumes, and local state from the default environment.
name: redmine-mcp-dev-6-0-1
services:
  mcp-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      REDMINE_WRITE_ENABLED: "false"
      REDMINE_URL: http://redmine:3000
      REDMINE_PUBLIC_URL: http://localhost:3001
    depends_on:
      redmine:
        condition: service_healthy

  mcp-writer:
    profiles: ["writer"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8000"
    environment:
      REDMINE_WRITE_ENABLED: "true"
      REDMINE_WRITER_AUTH_MODE: personal_key
      REDMINE_WRITER_OPERATIONS: ""
      REDMINE_URL: http://redmine:3000
      REDMINE_PUBLIC_URL: http://localhost:3001
    depends_on:
      redmine:
        condition: service_healthy

  postgres:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: redmine-local-development
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - redmine_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine -d redmine"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redmine:
    image: redmine:6.0.1@sha256:d59578dc62538c113beb983cf79eb0857715f84c5ede4e60f14ae90a0d66f05b
    entrypoint: ["/bin/bash", "/opt/redmine/install-plugins.sh"]
    command: ["rails", "server", "-b", "0.0.0.0", "-p", "3000"]
    environment:
      REDMINE_DB_POSTGRES: postgres
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: redmine-local-development
      REDMINE_SECRET_KEY_BASE: redmine-mcp-local-6.0.1-0123456789abcdef0123456789abcdef0123456789abcdef
      SECRET_KEY_BASE: redmine-mcp-local-6.0.1-0123456789abcdef0123456789abcdef0123456789abcdef
      TEST_USER_PASSWORD: redmine-demo-password
      REDMINE_TEST_MARKER: redmine-mcp-synthetic-v1
      REDMINE_E2E_OWNER: prep-018
      REDMINE_E2E_VERSION: "6.0.1"
      REDMINE_E2E_PROJECT: redmine-mcp-dev-6-0-1
      RAILS_ENV: production
      REDMINE_PLUGINS_MIGRATE: "1"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - redmine_files:/usr/src/redmine/files
      - ./redmine-plugins:/opt/redmine/plugins:ro
      - ./redmine/install-plugins.sh:/opt/redmine/install-plugins.sh:ro
      - ../tools/seed:/opt/seed:ro
      - ../tools/testing:/opt/testing:ro
      - e2e_state:/e2e-state
      - seed_state:/seed-state
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/login')).code == '200' ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  seed:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "0:0"
    environment:
      REDMINE_URL: http://redmine:3000
      REDMINE_TEST_MARKER: redmine-mcp-synthetic-v1
      TEST_USER_PASSWORD: redmine-demo-password
    volumes:
      - ../tools:/tools:ro
      - seed_state:/seed-state
    working_dir: /
    entrypoint: ["/app/.venv/bin/python", "-m", "tools.seed"]
    depends_on:
      redmine:
        condition: service_healthy

  backup-restore:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ops
    environment:
      PGHOST: postgres
      PGUSER: redmine
      PGDATABASE: redmine
      REDMINE_IMAGE_VERSION: "6.0.1"
      PGPASSWORD: redmine-local-development
    volumes:
      - redmine_files:/redmine-files
      - seed_state:/state
      - backup_data:/state/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  seed_state:
  e2e_state:
  backup_data:
  redmine_db_data:
    labels:
      redmine-mcp.environment: synthetic-test
      redmine-mcp.redmine-version: "6.0.1"
  redmine_files:
    labels:
      redmine-mcp.environment: synthetic-test
      redmine-mcp.redmine-version: "6.0.1"

