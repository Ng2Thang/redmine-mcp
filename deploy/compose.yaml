name: redmine-mcp
services:
  mcp-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      REDMINE_URL: ${REDMINE_URL:?Set REDMINE_URL}
      REDMINE_API_KEY: ${REDMINE_API_KEY:?Set REDMINE_API_KEY}
      MCP_API_TOKEN: ${MCP_API_TOKEN:?Set MCP_API_TOKEN}
      REDMINE_TIMEOUT_SECONDS: ${REDMINE_TIMEOUT_SECONDS:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

