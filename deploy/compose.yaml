name: redmine-mcp
services:
  mcp-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      REDMINE_URL: ${REDMINE_URL:?Set REDMINE_URL}
      REDMINE_WRITE_ENABLED: "false"
      REDMINE_TIMEOUT_SECONDS: ${REDMINE_TIMEOUT_SECONDS:-20}
      REDMINE_CONNECT_TIMEOUT_SECONDS: ${REDMINE_CONNECT_TIMEOUT_SECONDS:-5}
      REDMINE_POOL_TIMEOUT_SECONDS: ${REDMINE_POOL_TIMEOUT_SECONDS:-5}
      REDMINE_REQUEST_DEADLINE_SECONDS: ${REDMINE_REQUEST_DEADLINE_SECONDS:-60}
      REDMINE_READ_RETRY_MAX_ATTEMPTS: ${REDMINE_READ_RETRY_MAX_ATTEMPTS:-3}
      REDMINE_READ_RETRY_BASE_DELAY_SECONDS: ${REDMINE_READ_RETRY_BASE_DELAY_SECONDS:-0.5}
      REDMINE_READ_RETRY_MAX_DELAY_SECONDS: ${REDMINE_READ_RETRY_MAX_DELAY_SECONDS:-5}
      REDMINE_MAX_RESPONSE_BYTES: ${REDMINE_MAX_RESPONSE_BYTES:-10485760}
      REDMINE_MAX_BINARY_BYTES: ${REDMINE_MAX_BINARY_BYTES:-5242880}
      REDMINE_MAX_CONNECTIONS: ${REDMINE_MAX_CONNECTIONS:-100}
      REDMINE_MAX_KEEPALIVE_CONNECTIONS: ${REDMINE_MAX_KEEPALIVE_CONNECTIONS:-20}
      REDMINE_MAX_CONCURRENT_REQUESTS: ${REDMINE_MAX_CONCURRENT_REQUESTS:-50}
      REDMINE_ADMISSION_TIMEOUT_SECONDS: ${REDMINE_ADMISSION_TIMEOUT_SECONDS:-30}
      REDMINE_MAX_QUERY_PAGES: ${REDMINE_MAX_QUERY_PAGES:-10}
      REDMINE_READ_OPERATION_MAX_REQUESTS: ${REDMINE_READ_OPERATION_MAX_REQUESTS:-30}
      REDMINE_READ_OPERATION_DEADLINE_SECONDS: ${REDMINE_READ_OPERATION_DEADLINE_SECONDS:-90}
      REDMINE_READ_OPERATION_MAX_BYTES: ${REDMINE_READ_OPERATION_MAX_BYTES:-10485760}
      REDMINE_PUBLIC_URL: ${REDMINE_PUBLIC_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mcp-writer:
    profiles: ["writer"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      REDMINE_URL: ${REDMINE_URL:?Set REDMINE_URL}
      REDMINE_WRITE_ENABLED: "true"
      REDMINE_WRITER_OPERATIONS: ${REDMINE_WRITER_OPERATIONS:-}
      REDMINE_MEMBERSHIP_BATCH_MAX_REQUESTS: ${REDMINE_MEMBERSHIP_BATCH_MAX_REQUESTS:-300}
      REDMINE_MEMBERSHIP_BATCH_MAX_READ_BYTES: ${REDMINE_MEMBERSHIP_BATCH_MAX_READ_BYTES:-31457280}
      REDMINE_MEMBERSHIP_BATCH_DEADLINE_SECONDS: ${REDMINE_MEMBERSHIP_BATCH_DEADLINE_SECONDS:-300}
      REDMINE_TIMEOUT_SECONDS: ${REDMINE_TIMEOUT_SECONDS:-20}
      REDMINE_CONNECT_TIMEOUT_SECONDS: ${REDMINE_CONNECT_TIMEOUT_SECONDS:-5}
      REDMINE_POOL_TIMEOUT_SECONDS: ${REDMINE_POOL_TIMEOUT_SECONDS:-5}
      REDMINE_REQUEST_DEADLINE_SECONDS: ${REDMINE_REQUEST_DEADLINE_SECONDS:-60}
      REDMINE_READ_RETRY_MAX_ATTEMPTS: ${REDMINE_READ_RETRY_MAX_ATTEMPTS:-3}
      REDMINE_READ_RETRY_BASE_DELAY_SECONDS: ${REDMINE_READ_RETRY_BASE_DELAY_SECONDS:-0.5}
      REDMINE_READ_RETRY_MAX_DELAY_SECONDS: ${REDMINE_READ_RETRY_MAX_DELAY_SECONDS:-5}
      REDMINE_MAX_RESPONSE_BYTES: ${REDMINE_MAX_RESPONSE_BYTES:-10485760}
      REDMINE_MAX_BINARY_BYTES: ${REDMINE_MAX_BINARY_BYTES:-5242880}
      REDMINE_MAX_CONNECTIONS: ${REDMINE_MAX_CONNECTIONS:-100}
      REDMINE_MAX_KEEPALIVE_CONNECTIONS: ${REDMINE_MAX_KEEPALIVE_CONNECTIONS:-20}
      REDMINE_MAX_CONCURRENT_REQUESTS: ${REDMINE_MAX_CONCURRENT_REQUESTS:-50}
      REDMINE_ADMISSION_TIMEOUT_SECONDS: ${REDMINE_ADMISSION_TIMEOUT_SECONDS:-30}
      REDMINE_MAX_QUERY_PAGES: ${REDMINE_MAX_QUERY_PAGES:-10}
      REDMINE_READ_OPERATION_MAX_REQUESTS: ${REDMINE_READ_OPERATION_MAX_REQUESTS:-30}
      REDMINE_READ_OPERATION_DEADLINE_SECONDS: ${REDMINE_READ_OPERATION_DEADLINE_SECONDS:-90}
      REDMINE_READ_OPERATION_MAX_BYTES: ${REDMINE_READ_OPERATION_MAX_BYTES:-10485760}
      REDMINE_PUBLIC_URL: ${REDMINE_PUBLIC_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${MCP_WRITER_HOST_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

