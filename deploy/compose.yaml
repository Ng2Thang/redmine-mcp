name: redmine-mcp
services:
  mcp-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      REDMINE_URL: ${REDMINE_URL:?Set REDMINE_URL}
      REDMINE_WRITE_ENABLED: ${REDMINE_WRITE_ENABLED:-false}
      REDMINE_TIMEOUT_SECONDS: ${REDMINE_TIMEOUT_SECONDS:-20}
      REDMINE_CONNECT_TIMEOUT_SECONDS: ${REDMINE_CONNECT_TIMEOUT_SECONDS:-5}
      REDMINE_POOL_TIMEOUT_SECONDS: ${REDMINE_POOL_TIMEOUT_SECONDS:-5}
      REDMINE_REQUEST_DEADLINE_SECONDS: ${REDMINE_REQUEST_DEADLINE_SECONDS:-60}
      REDMINE_MAX_RESPONSE_BYTES: ${REDMINE_MAX_RESPONSE_BYTES:-10485760}
      REDMINE_MAX_BINARY_BYTES: ${REDMINE_MAX_BINARY_BYTES:-5242880}
      REDMINE_MAX_CONNECTIONS: ${REDMINE_MAX_CONNECTIONS:-100}
      REDMINE_MAX_KEEPALIVE_CONNECTIONS: ${REDMINE_MAX_KEEPALIVE_CONNECTIONS:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

