[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redmine-mcp"
version = "0.1.0"
description = "Read-only Redmine tools over FastAPI MCP"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "fastapi-mcp==0.4.0",
  "mcp>=1.12,<2",
  "httpx>=0.28,<0.29",
  "pydantic-settings>=2.8,<3",
  "uvicorn>=0.34,<1",
]
[dependency-groups]
dev = ["ruff>=0.11", "mypy>=1.15", "pre-commit>=4,<5"]
[tool.hatch.build.targets.wheel]
packages = ["src/redmine_mcp"]
[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "fastapi_mcp.*"
ignore_missing_imports = true

